services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oque_assistir
      POSTGRES_USER: oque_assistir
      POSTGRES_PASSWORD: oque_assistir
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oque_assistir -d oque_assistir"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build: ./app/server
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oque_assistir
      SPRING_DATASOURCE_USERNAME: oque_assistir
      SPRING_DATASOURCE_PASSWORD: oque_assistir
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./app/web
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres-data:
  ollama-data:
