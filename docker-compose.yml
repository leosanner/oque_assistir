services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oque_assistir
      POSTGRES_USER: oque_assistir
      POSTGRES_PASSWORD: oque_assistir
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oque_assistir -d oque_assistir"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
    # Start the server, pull the chat model (no-op once cached in the volume), keep serving
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve & pid=$$!
        trap 'kill $$pid' TERM INT
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$OLLAMA_CHAT_MODEL"
        wait $$pid
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    # Healthy only once the model is available, so dependants never hit a missing model
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$OLLAMA_CHAT_MODEL\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15m
    restart: unless-stopped

  server:
    build: ./app/server
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oque_assistir
      SPRING_DATASOURCE_USERNAME: oque_assistir
      SPRING_DATASOURCE_PASSWORD: oque_assistir
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./app/web
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres-data:
  ollama-data:
